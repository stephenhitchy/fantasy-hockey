<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07111d" />
    <title>RinkRat is offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #07111d;
        color: #f4f8fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(180deg, rgba(48, 190, 231, 0.12), transparent 38%),
          #07111d;
      }

      main {
        width: min(100%, 520px);
        padding: 28px;
        border: 2px solid #2c455b;
        border-top: 5px solid #49c8ee;
        background: #101d2b;
        box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.28);
      }

      img {
        width: 72px;
        height: 72px;
        object-fit: cover;
        image-rendering: pixelated;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: clamp(28px, 8vw, 42px);
        line-height: 1;
      }

      p {
        margin: 0;
        color: #b8c9d8;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        min-height: 48px;
        margin-top: 22px;
        align-items: center;
        justify-content: center;
        padding: 10px 18px;
        border: 2px solid #49c8ee;
        background: #16354a;
        color: #ffffff;
        font-weight: 850;
        text-decoration: none;
      }

      small {
        display: block;
        margin-top: 16px;
        color: #8298aa;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/branding/rinkrat-headshot.png" alt="" />
      <h1>RinkRat is offline</h1>
      <p>Reconnect to refresh live scores and league data. If you opened Game Center online on this device, reopen that exact matchup route to view its last saved read-only copy.</p>
      <a href="/">Try RinkRat again</a>
      <small>No Draft, roster, waiver, commissioner, or testing action was queued by this offline page.</small>
    </main>
  </body>
</html>
