<section class="pixel-shell-page rr-pixel-shell-page">
  <div class="shell-stage rr-pixel-shell-stage">
    <section class="shell-copy rr-pixel-shell-panel rr-pixel-shell-copy">
      <span class="eyebrow rr-pixel-shell-kicker">Join the Action</span>
      <h1>Join a League</h1>

      <a routerLink="/dashboard" class="back-link rr-pixel-shell-back-link" data-rinkrat-history-back>← Back</a>
    </section>

    <section class="shell-card rr-pixel-shell-panel rr-pixel-shell-form">
      <div class="card-header rr-pixel-shell-card-header">
        <span class="card-label rr-pixel-shell-kicker">Invite Code</span>
        <strong>League Entry</strong>
      </div>

      <p class="rr-notice rr-notice--info">
        Verified email required. Entry must still be open.
        <a routerLink="/account/settings">Review email verification</a>
      </p>

      <label class="form-field rr-pixel-shell-field">
        <span>Invite Code</span>
        <input
          class="invite-code-input"
          [(ngModel)]="inviteCode"
          placeholder="Ex: AB7K9Q"
          maxlength="6"
          pattern="[A-Za-z0-9]{6}"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
        />
      </label>

      <button type="button" class="primary-submit rr-button rr-pixel-shell-submit" (click)="submit()" [disabled]="loading()">
        {{ loading() ? 'Joining League...' : 'Join League' }}
      </button>

      @if (errorMessage()) {
        <p class="status-message error rr-notice rr-notice--danger rr-pixel-shell-error">{{ errorMessage() }}</p>
      }
    </section>

    <section class="pixel-mascot-card rr-pixel-shell-panel rr-pixel-shell-mascot" aria-hidden="true">
      <div class="mascot-scoreboard rr-pixel-shell-card-header">
        <span>Invitation</span>
        <strong>Skate In</strong>
      </div>
      <div class="mini-ref rr-pixel-shell-mini-ref"></div>
    </section>
  </div>


</section>
