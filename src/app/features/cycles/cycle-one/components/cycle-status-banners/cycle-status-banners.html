    @if (presenter.shouldShowCompactAutoStatus()) {
      <section
        class="compact-auto-status rr-notice rr-notice--info"
        [class.compact-status-error]="presenter.getAutoLeagueStatusClass() === 'auto-status-error'"
        [class.compact-status-working]="presenter.getAutoLeagueStatusClass() === 'auto-status-working'"
        role="status"
        aria-live="polite"
      >
        <span class="compact-status-indicator" aria-hidden="true"></span>

        <div>
          <strong>{{ presenter.getAutoLeagueStatusTitle() }}</strong>
          <p>{{ presenter.getAutoLeagueStatusText() }}</p>
        </div>
      </section>
    }
