version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 6
    groups:
      angular-runtime:
        dependency-type: production
        patterns:
          - '@angular/*'
          - 'rxjs'
        update-types: [minor, patch]
      firebase-browser:
        dependency-type: production
        patterns:
          - 'firebase'
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'firebase'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
      day: monday
      time: '09:15'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 6
    groups:
      firebase-server:
        dependency-type: production
        patterns:
          - 'firebase-admin'
          - 'firebase-functions'
        update-types: [minor, patch]
      functions-production-minor-patch:
        dependency-type: production
        exclude-patterns:
          - 'firebase-admin'
          - 'firebase-functions'
        update-types: [minor, patch]
      functions-development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: 'firebase-admin'
        update-types: ['version-update:semver-major']
      - dependency-name: 'firebase-functions'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 4
