name: RinkRat security and release verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rinkrat-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, emulator, regression, and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the verified Firebase CLI
        run: npm install --global firebase-tools@15.24.0

      - name: Install application dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Run strict dependency audit and complete release verification
        run: npm run security:ci

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rinkrat-security-reports
          path: .security-reports/
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
